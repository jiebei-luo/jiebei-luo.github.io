title: "Assistant Professor of Library and Information Studies"
institution: "University of Oklahoma"
email: jiebei.luo@ou.edu
photo: "jiebei-luo.jpg"

# ============================================================
# STEP 2: Your Links
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=lsDmHNgAAAAJ&hl=en"
  github: "https://github.com/jiebei-luo"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: "https://www.linkedin.com/in/jiebei-luo/"
  cv: ""

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#c44a2c"
dark_mode: false
description: "Academic website of Jiebei Luo"
baseurl: ""
url: "https://jiebei-luo.github.io"

analytics:
  google_id: ""

nav_pages:
  - name: about
  - name: publications
  - name: teaching
  - name: service

# ============================================================
# Advanced Settings
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Luo
  first_name: [Jiebei, J.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
